[package]
name = "devtool"
version = "0.5.0"
edition = "2024"
description = "Native CLI for files, directories, archives and configurable workflows"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["compress", "util"] }
tar = "0.4"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
