[package]
name = "devtool-auto"
version = "0.2.0"
edition = "2024"
description = "Standalone CLI for saved automation profiles and ordered command execution"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
