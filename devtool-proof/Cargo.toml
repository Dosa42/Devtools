[package]
name = "devtool-proof"
version = "0.2.0"
edition = "2024"
description = "Standalone hashes, manifests, signatures, provenance and AES-256 archives"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "2.2"
getrandom = "0.4"
hex = "0.4"
rpassword = "7.5"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "compress", "util"] }
tempfile = "3"
thiserror = "2"
zeroize = "1.8"
zip = { version = "=8.5.1", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
