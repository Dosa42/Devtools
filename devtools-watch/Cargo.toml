[package]
name = "devtools-watch"
version = "0.1.0"
edition = "2024"
description = "Deterministic background observer for canonical machine state"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
