<!DOCTYPE html>
<meta charset="utf-8"/>
<html>
    <head>
        <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1">
        <link rel="stylesheet" href="index.css">
        <base href="../../debug/">
    </head>

    <body>
        <div id="container">
            <div id="controlsRow">
                <button class="button" onmousedown="request(this, 'LISTENERS')">Reset listeners</button><br>
                <button class="button" onmousedown="request(this, 'IPD+')">IPD +</button><br>
                <button class="button" onmousedown="request(this, 'IPD-')">IPD -</button><br>
                <button class="button" onmousedown="request(this, 'DISPLACEMENT+')">DISPLACEMENT +</button><br>
                <button class="button" onmousedown="request(this, 'DISPLACEMENT-')">DISPLACEMENT -</button><br>
                <button class="button" onmousedown="request(this, 'SHARPEN')">Toggle Sharpen</button><br>
                <h3>Log:</h3>
            </div>
            <div id="logRow">
                <div id="logCell">
                    <div id="logContainer">
                        <div id="log"></div>
                    </div>
                </div>
            </div>
        </div>

        <script src="../assets/debug/index.js" type="text/javascript" charset="utf-8"></script>
    </body>
</html>
